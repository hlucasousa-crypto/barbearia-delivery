<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema</title>

<style>

body{
background:black;
color:#00ff00;
font-family:monospace;
padding:20px;
font-size:18px;
}

#terminal{
white-space:pre-line;
}

.barra{
width:100%;
height:20px;
background:#222;
margin-top:20px;
border-radius:10px;
overflow:hidden;
}

.progresso{
height:100%;
width:0%;
background:#00ff00;
}

</style>

</head>

<body>

<div id="terminal"></div>

<div class="barra">
<div class="progresso" id="progresso"></div>
</div>

<script>

const linhas = [
"Iniciando sistema...",
"Verificando dispositivo...",
"Estabelecendo conexão segura...",
"Carregando módulos...",
"Processando dados...",
"Sincronizando sistema...",
"",
"FINALIZANDO..."
];

let i = 0;

function escrever(){

if(i < linhas.length){

document.getElementById("terminal").innerHTML += linhas[i] + "\n";

i++;

setTimeout(escrever,700);

}

}

escrever();

let progresso = 0;

function barra(){

if(progresso < 100){

progresso++;

document.getElementById("progresso").style.width = progresso + "%";

setTimeout(barra,60);

}else{

document.getElementById("terminal").innerHTML += "\n✔ Sistema concluído com sucesso.";

}

}

barra();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucas Barbearia Delivery</title>
<style>
body {font-family: Arial, sans-serif; background: #e0e0e0; margin:0; padding:0;}
header {background:#1f1f2e; color:white; text-align:center; padding:25px; font-size:24px; font-weight:bold;}
.container {max-width:500px; background:white; margin:30px auto; padding:20px; border-radius:10px; box-shadow:0 0 15px #aaa;}
input, select, button {width:100%; padding:12px; margin-top:10px; font-size:16px; border-radius:6px; border:1px solid #ccc; box-sizing:border-box;}
button {background:#0b8457; color:white; font-weight:bold; border:none; cursor:pointer; transition:0.3s;}
button:hover {background:#065a3d;}
h3 {text-align:center;}
hr {margin:15px 0;}
.agendamento {background:#f9f9f9; padding:8px; margin-bottom:5px; border-radius:5px; display:flex; justify-content:space-between; align-items:center;}
.agendamento span {color:green; font-weight:bold;}
.aviso {background:#ffcc00; padding:10px; margin:10px 0; border-radius:6px; color:#333; font-weight:bold;}
</style>
</head>
<body>

<header>Lucas Barbearia Delivery 💈</header>

<div class="container" id="agendamentoContainer">
<h3>Agendar Serviço</h3>

<div id="mensagemAviso"></div>

<input id="nome" placeholder="Nome do cliente">
<input id="telefone" placeholder="Telefone">
<input id="endereco" placeholder="Endereço">

<select id="servico">
  <option value="" disabled selected>Escolha o serviço</option>
  <option value="Corte">💇‍♂️ Corte - R$35</option>
  <option value="Corte e Barba">💇‍♂️✂️ Corte e Barba - R$55</option>
  <option value="Corte e Sobrancelha">💇‍♂️👁 Corte e Sobrancelha - R$40</option>
  <option value="Corte, Barba e Sobrancelha">💇‍♂️✂️👁 Corte, Barba e Sobrancelha - R$65</option>
</select>

<input type="date" id="data" min="">
<select id="horario">
  <option value="" disabled selected>Escolha o horário</option>
</select>

<button id="btnAgendar" onclick="agendar()">Agendar</button>
<hr>
<button onclick="mostrarLogin()">Painel do Barbeiro</button>

<div id="painel" style="display:none;">
<h3>Digite a senha para acessar os agendamentos</h3>
<input type="password" id="senha" placeholder="Senha">
<button onclick="acessarPainel()">Entrar</button>
<div id="listaAgendamentos" style="margin-top:15px;"></div>
</div>
</div>

<script>
// senha do barbeiro
const SENHA = "1234";

// definir data mínima para hoje
document.getElementById("data").valueAsDate = new Date();
document.getElementById("data").min = new Date().toISOString().split("T")[0];

// carregar agendamentos do localStorage
let agendamentos = JSON.parse(localStorage.getItem("agendamentos") || "[]");

// gerar horários das 7:00 até 21:00 com intervalos de 40 min
function gerarHorarios() {
  const select = document.getElementById("horario");
  select.innerHTML = '<option value="" disabled selected>Escolha o horário</option>';
  let hora = 7;
  let min = 0;
  while(hora<21 || (hora===21 && min===0)){
    const h = hora.toString().padStart(2,'0');
    const m = min.toString().padStart(2,'0');
    const horarioStr = `${h}:${m}`;
    select.innerHTML += `<option value="${horarioStr}">${horarioStr}</option>`;
    min += 40;
    if(min>=60){ hora++; min -=60;}
  }
}

// atualizar lista e bloquear horários
function atualizarLista(){
  const div = document.getElementById("listaAgendamentos");
  div.innerHTML = "";
  agendamentos.sort((a,b)=>{
    return a.data.localeCompare(b.data) || a.horario.localeCompare(b.horario);
  });
  agendamentos.forEach((a)=>{
    const el = document.createElement("div");
    el.className="agendamento";
    el.innerHTML = `${a.data} ${a.horario} - ${a.nome} | ${a.servico} | ${a.telefone} | ${a.endereco} <span>✅ Agendado</span>`;
    div.appendChild(el);
  });

  // gerar horários de novo
  gerarHorarios();

  const dataSelecionada = document.getElementById("data").value;
  const nomeCliente = document.getElementById("nome").value.trim();
  const telefoneCliente = document.getElementById("telefone").value.trim();
  const avisoDiv = document.getElementById("mensagemAviso");
  avisoDiv.innerHTML = "";
  document.getElementById("btnAgendar").disabled = false;

  // bloquear horários já ocupados
  agendamentos.forEach(a=>{
    if(a.data === dataSelecionada){
      const option = document.getElementById("horario").querySelector(`option[value='${a.horario}']`);
      if(option){
        option.disabled = true;
        option.textContent += " (Ocupado)";
      }
    }
  });

  // verificar se cliente já agendou naquele dia (baseado em nome ou telefone)
  if(nomeCliente || telefoneCliente){
    const agendamentoHoje = agendamentos.find(a=>a.data===dataSelecionada && (a.nome===nomeCliente || a.telefone===telefoneCliente));
    if(agendamentoHoje){
      avisoDiv.innerHTML = `⚠️ Você já tem um horário agendado hoje às ${agendamentoHoje.horario}`;
      document.getElementById("btnAgendar").disabled = true;
    }
  }
}

// listeners
document.getElementById("data").addEventListener("change", atualizarLista);
document.getElementById("nome").addEventListener("input", atualizarLista);
document.getElementById("telefone").addEventListener("input", atualizarLista);

// agendar
function agendar(){
  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const endereco = document.getElementById("endereco").value.trim();
  const servico = document.getElementById("servico").value;
  const horario = document.getElementById("horario").value;
  const data = document.getElementById("data").value;

  if(!nome || !telefone || !endereco || !servico || !horario || !data){
    alert("Preencha todos os campos!");
    return;
  }

  if(agendamentos.find(a=>a.data===data && a.horario===horario)){
    alert("Horário ocupado! Escolha outro.");
    return;
  }

  const agendamento = {nome, telefone, endereco, servico, horario, data};
  agendamentos.push(agendamento);
  localStorage.setItem("agendamentos", JSON.stringify(agendamentos));
  atualizarLista();
  alert("Agendamento confirmado ✅!");
}

// mostrar painel do barbeiro
function mostrarLogin(){
  document.getElementById("painel").style.display = "block";
}

// acessar painel
function acessarPainel(){
  const senha = document.getElementById("senha").value;
  if(senha === SENHA){
    alert("Acesso liberado! Você pode ver todos os agendamentos.");
    atualizarLista();
  } else {
    alert("Senha incorreta!");
  }
}

// gerar horários e atualizar lista ao carregar
gerarHorarios();
atualizarLista();

</script>
</body>
</html>

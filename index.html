<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucas Barbearia Delivery</title>
<style>
body { font-family: Arial; text-align:center; background:#1c1c1c; color:white; }
h1 { color:#f39c12; }
input, select { padding:10px; margin:5px; width:200px; }
button { padding:10px 20px; margin-top:10px; background:#f39c12; border:none; cursor:pointer; }
button:hover { background:#e67e22; }
#confirmacao { margin-top:20px; font-size:20px; color:#00ff00; }
#painel { margin-top:30px; text-align:left; max-width:500px; margin-left:auto; margin-right:auto; }
.agendamento { background:#222; padding:10px; margin:5px 0; border-radius:8px; }
</style>
</head>
<body>
<h1>Lucas Barbearia Delivery</h1>
<p>Agende seu horário:</p>

<input type="text" id="nome" placeholder="Nome" required><br>
<input type="text" id="telefone" placeholder="Telefone" required><br>

<select id="servico">
  <option value="Corte – R$35">Corte – R$35</option>
  <option value="Corte + Barba – R$55">Corte + Barba – R$55</option>
  <option value="Corte + Sobrancelha – R$40">Corte + Sobrancelha – R$40</option>
  <option value="Corte + Barba + Sobrancelha – R$65">Corte + Barba + Sobrancelha – R$65</option>
</select><br>

<input type="date" id="data" required><br>

<select id="horario">
  <option value="07:00">07:00</option>
  <option value="07:40">07:40</option>
  <option value="08:20">08:20</option>
  <option value="09:00">09:00</option>
  <option value="09:40">09:40</option>
  <option value="10:20">10:20</option>
  <option value="11:00">11:00</option>
  <option value="11:40">11:40</option>
  <option value="12:20">12:20</option>
  <option value="13:00">13:00</option>
  <option value="13:40">13:40</option>
  <option value="14:20">14:20</option>
  <option value="15:00">15:00</option>
  <option value="15:40">15:40</option>
  <option value="16:20">16:20</option>
  <option value="17:00">17:00</option>
  <option value="17:40">17:40</option>
  <option value="18:20">18:20</option>
  <option value="19:00">19:00</option>
  <option value="19:40">19:40</option>
  <option value="20:20">20:20</option>
  <option value="21:00">21:00</option>
</select><br>

<button onclick="enviarAgendamento()">Agendar</button>

<div id="confirmacao"></div>

<h2>Painel de Agendamentos (só você)</h2>
<div id="painel"></div>

<script>
// Lista para armazenar agendamentos
let agendamentos = [];

// Função de enviar agendamento
function enviarAgendamento(){
  const nome = document.getElementById("nome").value;
  const telefone = document.getElementById("telefone").value;
  const servico = document.getElementById("servico").value;
  const data = document.getElementById("data").value;
  const horario = document.getElementById("horario").value;

  if(!nome || !telefone || !data){
    alert("Preencha todos os campos!");
    return;
  }

  // Verificar se já existe agendamento nesse dia/horário
  const existe = agendamentos.some(a => a.data===data && a.horario===horario);
  if(existe){
    alert("⛔ Esse horário já está ocupado!");
    return;
  }

  // Adicionar na lista
  agendamentos.push({nome, telefone, servico, data, horario});
  document.getElementById("confirmacao").innerHTML = "✅ Agendamento feito com sucesso!";

  // Limpar campos
  document.getElementById("nome").value="";
  document.getElementById("telefone").value="";
  document.getElementById("data").value="";

  // Atualizar painel
  mostrarPainel();
}

// Função de mostrar painel
function mostrarPainel(){
  const painel = document.getElementById("painel");
  painel.innerHTML = "";
  agendamentos.forEach(a=>{
    const div = document.createElement("div");
    div.className="agendamento";
    div.innerHTML = `Nome: ${a.nome}<br>Tel: ${a.telefone}<br>Serviço: ${a.servico}<br>Data: ${a.data} | Horário: ${a.horario}`;
    painel.appendChild(div);
  });
}
</script>

</body>
</html>

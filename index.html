<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Uma surpresa</title>

<style>
body{
    margin:0;
    padding:0;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
    color:white;
}

h1{
    font-size:38px;
}

p{
    font-size:20px;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:white;
    color:#2575fc;
    font-size:18px;
    cursor:pointer;
}

.hidden{
    display:none;
}

.heart{
    position:absolute;
    font-size:22px;
    animation:float 6s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(100vh);
        opacity:1;
    }
    100%{
        transform:translateY(-10vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Oi Dayane ✨</h1>
    <p>Eu fiz uma pequena surpresa pra você...</p>
    <button onclick="mostrar()">Abrir</button>

    <div id="mensagem" class="hidden">
        <h1>Dayane 😊</h1>
        <p>
        Entre tantas pessoas no mundo,<br>
        foi você que apareceu no meu caminho.<br><br>

        Gosto da sua companhia<br>
        e de dividir momentos com você.<br><br>

        Espero que a gente ainda viva<br>
        muitas coisas boas juntos ✨
        </p>
    </div>
</div>

<script>

function mostrar(){
    document.getElementById("mensagem").classList.remove("hidden");
}

function criarCoracao(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="✨";

    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(3+Math.random()*3)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },6000);
}

setInterval(criarCoracao,300);

</script>

</body>
</html>

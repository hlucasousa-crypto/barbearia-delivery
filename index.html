<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surpresa</title>

<style>

body{
margin:0;
padding:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#ff5fa2,#ff8ac6);
overflow:hidden;
color:white;
}

.container{
padding:20px;
max-width:400px;
}

h1{
font-size:30px;
margin-bottom:10px;
}

p{
font-size:18px;
}

button{
margin-top:25px;
padding:14px 30px;
font-size:18px;
border:none;
border-radius:30px;
background:white;
color:#ff4f9a;
cursor:pointer;
}

.hidden{
display:none;
}

.heart{
position:fixed;
font-size:22px;
animation:subir linear forwards;
}

@keyframes subir{
0%{
transform:translateY(100vh);
opacity:1;
}
100%{
transform:translateY(-10vh);
opacity:0;
}
}

</style>

</head>

<body>

<div class="container">

<h1>Oi Dayane 💗</h1>

<p>Clique no botão abaixo...</p>

<button onclick="mostrar()">Abrir surpresa</button>

<div id="mensagem" class="hidden">

<h1>Dayane ✨</h1>

<p>
Gosto muito da sua companhia.<br><br>

Entre tantas pessoas no mundo,<br>
foi você que apareceu no meu caminho.<br><br>

Espero que a gente ainda viva<br>
muitos momentos bons juntos 💗
</p>

</div>

</div>

<script>

function mostrar(){

document.getElementById("mensagem").classList.remove("hidden");

for(let i=0;i<60;i++){
setTimeout(criarCoracao,i*80);
}

}

function criarCoracao(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="💗";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(16+Math.random()*24)+"px";

heart.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(heart);

setTimeout(function(){
heart.remove();
},6000);

}

</script>

</body>

</html>

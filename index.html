<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema</title>

<style>

body{
background:black;
color:#00ff00;
font-family:monospace;
padding:20px;
font-size:18px;
}

#terminal{
white-space:pre-wrap;
}

.cursor{
display:inline-block;
width:10px;
background:#00ff00;
margin-left:4px;
animation:piscar 1s infinite;
}

@keyframes piscar{
0%{opacity:1;}
50%{opacity:0;}
100%{opacity:1;}
}

</style>

</head>

<body>

<div id="terminal"></div><span class="cursor"></span>

<script>

const linhas = [

"Iniciando sistema...",
"Verificando dispositivo...",
"Conectando ao sistema...",
"Processando dados...",
"Carregando módulos...",
"Executando verificação...",
"",
"Verificando permissões do sistema...",
"",
"whatsapp assesso consedido",
"facebook acesso consedido",
"instagram acesso consedido",
"sim1 acesso permitido",
"sms acesso consedido"

];

let linhaAtual = 0;
let letraAtual = 0;

function digitar(){

if(linhaAtual >= linhas.length) return;

let terminal = document.getElementById("terminal");

if(letraAtual < linhas[linhaAtual].length){

terminal.innerHTML += linhas[linhaAtual].charAt(letraAtual);
letraAtual++;

setTimeout(digitar,35);

}else{

terminal.innerHTML += "\n";
linhaAtual++;
letraAtual = 0;

setTimeout(digitar,400);

}

}

digitar();

</script>

</body>

</html>

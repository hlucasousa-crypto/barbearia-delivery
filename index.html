<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💈 Lucas Barbearia Delivery</title>
<style>
body {font-family: Arial, sans-serif; background: #e0e0e0; margin:0; padding:0;}
header {background:#1f1f2e; color:white; text-align:center; padding:25px; font-size:24px; font-weight:bold;}
.container {max-width:500px; background:white; margin:30px auto; padding:20px; border-radius:10px; box-shadow:0 0 15px #aaa;}
input, select, button {width:100%; padding:12px; margin-top:10px; font-size:16px; border-radius:6px; border:1px solid #ccc; box-sizing:border-box;}
button {background:#0b8457; color:white; font-weight:bold; border:none; cursor:pointer; transition:0.3s;}
button:hover {background:#065a3d;}
h3 {text-align:center;}
option.ocupado {color:#aaa;}
#confirmacao {display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%) scale(0); font-size:100px; color:green; z-index:9999; transition: transform 0.5s ease;}
#painel {display:block; max-width:800px; margin:20px auto; background:white; padding:15px; border-radius:10px; box-shadow:0 0 15px #aaa;}
table {width:100%; border-collapse:collapse;}
th, td {padding:10px; border:1px solid #ccc; text-align:left;}
th {background:#1f1f2e; color:white;}
.cancelar {background:#d9534f; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;}
.cancelar:hover {background:#a94442;}
</style>
</head>
<body>

<header>💈 Lucas Barbearia Delivery</header>

<div class="container">
<h3>Agendar Serviço</h3>

<div id="mensagemAviso"></div>

<input id="nome" placeholder="Nome do cliente">
<input id="telefone" placeholder="Telefone">
<input id="endereco" placeholder="Endereço">

<select id="servico">
  <option value="" disabled selected>Escolha o serviço</option>
  <option value="Corte">Corte - R$35</option>
  <option value="Corte e Barba">Corte e Barba - R$55</option>
  <option value="Corte e Sobrancelha">Corte e Sobrancelha - R$40</option>
  <option value="Corte, Barba e Sobrancelha">Corte, Barba e Sobrancelha - R$65</option>
</select>

<input type="date" id="data" min="">
<select id="horario">
  <option value="" disabled selected>Escolha o horário</option>
</select>

<button id="btnAgendar" onclick="agendar()">Agendar</button>
</div>

<div id="confirmacao">✅</div>

<!-- Painel do dono -->
<div id="painel">
<h3>Painel de Agendamentos</h3>
<table id="tabelaAgendamentos">
<thead>
<tr>
<th>Cliente</th>
<th>Telefone</th>
<th>Endereço</th>
<th>Serviço</th>
<th>Data</th>
<th>Horário</th>
<th>Ação</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script>
// carregar agendamentos
let agendamentos = JSON.parse(localStorage.getItem("agendamentos") || "[]");

// definir data mínima
const dataInput = document.getElementById("data");
dataInput.valueAsDate = new Date();
dataInput.min = new Date().toISOString().split("T")[0];

// gerar horários
function gerarHorarios(){
  const select = document.getElementById("horario");
  select.innerHTML = '<option value="" disabled selected>Escolha o horário</option>';
  const dataSelecionada = dataInput.value;
  let hora = 7, min = 0;

  while(hora<21 || (hora===21 && min===0)){
    const h = hora.toString().padStart(2,'0');
    const m = min.toString().padStart(2,'0');
    const horarioStr = `${h}:${m}`;
    const ocupado = agendamentos.some(a => a.data === dataSelecionada && a.horario === horarioStr);
    if(ocupado){
      select.innerHTML += `<option value="${horarioStr}" disabled class="ocupado">${horarioStr} (Ocupado)</option>`;
    } else {
      select.innerHTML += `<option value="${horarioStr}">${horarioStr}</option>`;
    }
    min += 40;
    if(min>=60){ hora++; min -=60; }
  }
}

// atualizar aviso do cliente
function atualizarAviso(){
  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const dataSelecionada = dataInput.value;
  const avisoDiv = document.getElementById("mensagemAviso");
  avisoDiv.innerHTML = "";
  document.getElementById("btnAgendar").disabled = false;
  if(nome || telefone){
    const agendamentoHoje = agendamentos.find(a=>a.data===dataSelecionada && (a.nome===nome || a.telefone===telefone));
    if(agendamentoHoje){
      avisoDiv.innerHTML = `⚠️ Você já tem um horário agendado hoje às ${agendamentoHoje.horario}`;
      document.getElementById("btnAgendar").disabled = true;
    }
  }
}

// atualizar painel do dono
function atualizarPainel(){
  const tbody = document.querySelector("#tabelaAgendamentos tbody");
  tbody.innerHTML = "";
  agendamentos.forEach((a,index)=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${a.nome}</td>
      <td>${a.telefone}</td>
      <td>${a.endereco}</td>
      <td>${a.servico}</td>
      <td>${a.data}</td>
      <td>${a.horario}</td>
      <td><button class="cancelar" onclick="cancelar(${index})">Cancelar</button></td>
    `;
    tbody.appendChild(tr);
  });
}

// cancelar agendamento
function cancelar(index){
  if(confirm("Deseja realmente cancelar este agendamento?")){
    agendamentos.splice(index,1);
    localStorage.setItem("agendamentos", JSON.stringify(agendamentos));
    gerarHorarios();
    atualizarAviso();
    atualizarPainel();
  }
}

// listeners
dataInput.addEventListener("change", ()=>{ gerarHorarios(); atualizarAviso(); });
document.getElementById("nome").addEventListener("input", atualizarAviso);
document.getElementById("telefone").addEventListener("input", atualizarAviso);

// função agendar
function agendar(){
  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const endereco = document.getElementById("endereco").value.trim();
  const servico = document.getElementById("servico").value;
  const horario = document.getElementById("horario").value;
  const data = dataInput.value;

  if(!nome || !telefone || !endereco || !servico || !horario || !data){
    alert("Preencha todos os campos!");
    return;
  }

  if(agendamentos.find(a=>a.data===data && a.horario===horario)){
    alert("Horário ocupado! Escolha outro.");
    return;
  }

  agendamentos.push({nome, telefone, endereco, servico, horario, data});
  localStorage.setItem("agendamentos", JSON.stringify(agendamentos));
  
  gerarHorarios(); 
  atualizarAviso();
  atualizarPainel();

  // animação ✅ gigante
  const conf = document.getElementById("confirmacao");
  conf.style.display = "block";
  conf.style.transform = "translate(-50%, -50%) scale(0)";
  setTimeout(() => { conf.style.transform = "translate(-50%, -50%) scale(1.5)"; }, 50);
  setTimeout(() => {
    conf.style.transform = "translate(-50%, -50%) scale(0)";
    setTimeout(()=>{ conf.style.display = "none"; },500);
  }, 2000);

  // enviar mensagem para seu WhatsApp
  const numeroWhatsApp = "5517992239338"; // SEU NÚMERO
  const mensagem = `Novo agendamento!\nCliente: ${nome}\nTelefone: ${telefone}\nEndereço: ${endereco}\nServiço: ${servico}\nData: ${data}\nHorário: ${horario}`;
  const urlWhats = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;
  window.open(urlWhats, "_blank");
}

// inicialização
gerarHorarios();
atualizarAviso();
atualizarPainel();
</script>
</body>
</html>
